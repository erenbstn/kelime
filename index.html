<title>B1 Kelime Kartları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen study app — index card centre stage, tab bar at the bottom, ruled-paper card with a margin line */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#18213D; --muted:#5D6785; --line:#DCE2EF;
  --rule:#C9D6F2; --margin:#E0625A; --accent:#2F5FD0; --accent-ink:#FFFFFF;
  --learning:#B7791F; --learning-bg:#FDF1DC; --learned:#2F855A; --learned-bg:#DDF3E6;
  --new-bg:#ECEFF6;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1426; --surface:#18203A; --ink:#E8ECF7; --muted:#9AA4C3; --line:#2A3456;
  --rule:#26315A; --margin:#C2554F; --accent:#7EA2F5; --accent-ink:#0F1426;
  --learning:#F2B95B; --learning-bg:#3A2E16; --learned:#6FD39C; --learned-bg:#173A29; --new-bg:#222B4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1426; --surface:#18203A; --ink:#E8ECF7; --muted:#9AA4C3; --line:#2A3456;
  --rule:#26315A; --margin:#C2554F; --accent:#7EA2F5; --accent-ink:#0F1426;
  --learning:#F2B95B; --learning-bg:#3A2E16; --learned:#6FD39C; --learned-bg:#173A29; --new-bg:#222B4A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.sync{font-size:12px;color:var(--muted);text-align:right}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;min-height:0}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.dayhead h1{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.dayhead .sub{font-size:13px;color:var(--muted)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:18px;display:grid;place-items:center}
.dots{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.dot{width:26px;height:8px;border-radius:4px;background:var(--new-bg);border:0;padding:0}
.dot.l1{background:var(--learning)} .dot.l2{background:var(--learned)}
.dot.cur{outline:2px solid var(--accent);outline-offset:2px}
/* index card */
.card{position:relative;background:var(--surface);border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,70,.35);
  padding:22px 20px 18px 34px;min-height:340px;display:flex;flex-direction:column;gap:10px;
  border-top:6px solid var(--rule)}
.card::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .emoji{font-size:84px;line-height:1.1;text-align:center;min-height:96px;display:grid;place-items:center}
.card .emoji.none{font-family:var(--f-display);font-size:28px;color:var(--muted)}
.card .word{font-family:var(--f-display);font-weight:800;font-size:34px;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.card .pos{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}
.reveal{border:2px dashed var(--line);background:none;border-radius:12px;padding:14px;color:var(--muted);font-weight:700}
.answer{display:flex;flex-direction:column;gap:8px;text-align:center}
.answer .tr{font-size:22px;font-weight:700}
.answer .ex{font-style:italic;color:var(--muted)}
.answer a{color:var(--accent);font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:14px 10px;font-weight:700;font-size:15px}
.btn.learning{background:var(--learning-bg);color:var(--learning)}
.btn.learned{background:var(--learned-bg);color:var(--learned)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn[aria-pressed="true"]{outline:2px solid currentColor}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.navrow .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--new-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:6px}
/* list */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.row .e{font-size:26px;text-align:center}
.row .t{min-width:0}
.row .t b{display:block;overflow-wrap:anywhere}
.row .t span{font-size:13px;color:var(--muted);display:block;overflow-wrap:anywhere}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;border:0;white-space:nowrap;font-weight:700}
.pill.s0{background:var(--new-bg);color:var(--muted)} .pill.s1{background:var(--learning-bg);color:var(--learning)} .pill.s2{background:var(--learned-bg);color:var(--learned)}
.more{margin:14px auto;display:block}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--new-bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.section{margin:18px 0}
.section h2{font-family:var(--f-display);font-size:17px;margin:0 0 8px}
.form{display:grid;gap:8px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.form input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card.flip{transform:scale(.985)}}
</style>

</head><body>

  </nav>
</div>

<script>
(function(){
const W = JSON.parse(document.getElementById('data').textContent); // [word,pos,emoji,tr,ex], index = Sıra-1
const DAY = 86400000;
const state = { s:{}, goal:10, start:'2026-10-09', mine:[], tab:'today', dayOffset:0, idx:0, shown:false,
  dir:'en', reviewQ:null, reviewIdx:0, q:'', filter:'all', limit:60,  };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = w => 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(w.replace(/\s*\(.*?\)/g,'').split('/')[0].trim());
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1600)}

// ---------- persistence: synced db when available, else this device only ----------
function loadLocal(){const n=new Date();state.start=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');try{const j=JSON.parse(localStorage.getItem('b1kk')||'null');if(!j)saveLocal();if(j){state.s=j.s||{};state.goal=j.goal||10;state.start=j.start||state.start;state.mine=j.mine||[]}}catch(e){}}
function saveLocal(){try{localStorage.setItem('b1kk',JSON.stringify({s:state.s,goal:state.goal,start:state.start,mine:state.mine}))}catch(e){}}
function saveProgress(){ saveLocal(); }
function setStatus(i,v){ state.s[i]=v; saveProgress(); }
function initDb(){
  loadLocal();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  $('#sync').textContent='Bu cihazda kayıtlı';
  render();
}
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,s:state.s,goal:state.goal,start:state.start,mine:state.mine})))); }
function importCode(code){
  const j=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  if(!j||typeof j.s!=='object') throw new Error('bad');
  state.s=j.s; state.goal=j.goal||10; state.start=j.start||state.start; state.mine=Array.isArray(j.mine)?j.mine:[];
  saveLocal();
}

// ---------- day logic ----------
function startMs(){ const [y,m,d]=state.start.split('-').map(Number); return new Date(y,m-1,d).getTime(); }
function todayMs(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(); }
function dayNo(){ return Math.max(1, Math.round((todayMs()-startMs())/DAY)+1 + state.dayOffset); }
const totalDays = () => Math.ceil(W.length/state.goal);
function dayWords(d){ const a=(d-1)*state.goal; return W.slice(a,a+state.goal).map((w,k)=>a+k); }
function fmtDate(d){ const t=new Date(startMs()+(d-1)*DAY); return t.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'}); }
const st = i => state.s[i]||0;

// ---------- card ----------
function cardHTML(item, meta){
  const front = state.dir==='en'
    ? `<div class="word">${esc(item.en)}</div><div class="pos">${esc(item.pos)}</div>`
    : `<div class="word" style="font-size:26px">${esc(item.tr)}</div><div class="pos">${esc(item.pos)}</div>`;
  const back = state.dir==='en'
    ? `<div class="tr">${esc(item.tr)}</div>` : `<div class="tr" style="font-family:var(--f-display);font-size:28px">${esc(item.en)}</div>`;
  return `<article class="card" id="card">
    <div class="meta"><span>${meta}</span><span>${item.mine?'Kendi kelimem':'Sıra '+(item.i+1)}</span></div>
    <div class="emoji${item.emoji?'':' none'}" aria-hidden="true">${item.emoji?esc(item.emoji):'Aa'}</div>
    ${front}
    ${state.shown ? `<div class="answer">${back}${item.ex?`<div class="ex">“${esc(item.ex)}”</div>`:''}
      <a href="${img(item.en)}" target="_blank" rel="noopener">🔍 Gerçek fotoğraflara bak</a></div>`
      : `<button class="reveal" id="reveal">Anlamı göster</button>`}
  </article>
  <div class="actions">
    <button class="btn learning" data-set="1" aria-pressed="${item.status===1}">🤔 Öğreniyorum</button>
    <button class="btn learned" data-set="2" aria-pressed="${item.status===2}">✅ Öğrendim</button>
  </div>`;
}
const fromIdx = i => ({i, en:W[i][0], pos:W[i][1], emoji:W[i][2], tr:W[i][3], ex:W[i][4], status:st(i)});
const fromMine = m => ({mine:true, id:m.id, en:m.en, pos:m.pos||'', emoji:m.emoji||'', tr:m.tr||'', ex:m.ex||'', status:m.status||0});
function dirSeg(){ return `<div class="seg" style="margin-bottom:10px"><button data-dir="en" aria-pressed="${state.dir==='en'}">İngilizce → Türkçe</button><button data-dir="tr" aria-pressed="${state.dir==='tr'}">Türkçe → İngilizce</button></div>`; }

function renderToday(){
  const d=dayNo(), ids=dayWords(d); if(state.idx>=ids.length) state.idx=0;
  const done=ids.filter(i=>st(i)===2).length;
  const isToday = state.dayOffset===0;
  let h=`<div class="dayhead"><button class="iconbtn" id="prevDay" aria-label="Önceki gün" ${d<=1?'disabled':''}>‹</button>
    <div style="text-align:center"><h1>${isToday?'Bugün':'Gün '+d} · ${done}/${ids.length}</h1><div class="sub">Gün ${d} / ${totalDays()} · ${fmtDate(d)}</div></div>
    <button class="iconbtn" id="nextDay" aria-label="Sonraki gün" ${d>=totalDays()?'disabled':''}>›</button></div>`;
  h+=`<div class="dots">${ids.map((i,k)=>`<button class="dot l${st(i)} ${k===state.idx?'cur':''}" data-go="${k}" aria-label="Kart ${k+1}"></button>`).join('')}</div>`;
  h+=dirSeg();
  if(!ids.length){ $('#main').innerHTML=h+`<div class="empty"><b>Liste bitti 🎉</b>Tüm kelimeleri gördün.</div>`; return; }
  h+=cardHTML(fromIdx(ids[state.idx]), `Kart ${state.idx+1}/${ids.length}`);
  h+=`<div class="navrow"><button class="btn ghost" id="prev">‹ Önceki</button>${!isToday?`<button class="btn ghost" id="backToday">Bugüne dön</button>`:''}<button class="btn primary" id="next">Sonraki ›</button></div>`;
  $('#main').innerHTML=h;
}
function buildReview(){
  const td=Math.max(1,Math.round((todayMs()-startMs())/DAY)+1);
  const learning=Object.keys(state.s).filter(k=>state.s[k]===1).map(Number).map(fromIdx);
  const missed=[]; for(let i=0;i<Math.min(W.length,(td-1)*state.goal);i++) if(!st(i)) missed.push(fromIdx(i));
  const mine=state.mine.filter(m=>(m.status||0)!==2).map(fromMine);
  const q=[...learning,...mine,...missed.slice(0,40)];
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  state.reviewQ=q.map(x=>x.mine?{mine:x.id}:{i:x.i}); state.reviewIdx=0;
}
function renderReview(){
  if(!state.reviewQ) buildReview();
  const Q=state.reviewQ;
  let h=`<div class="dayhead"><div><h1>Tekrar</h1><div class="sub">“Öğreniyorum” işaretlediklerin, kendi kelimelerin ve geçmiş günlerde atladıkların</div></div><button class="iconbtn" id="shuffle" aria-label="Yeniden karıştır">⟳</button></div>`;
  h+=dirSeg();
  if(!Q.length){ $('#main').innerHTML=h+`<div class="empty"><b>Tekrar edilecek kelime yok</b>Bir kartta “Öğreniyorum” dediğinde burada görünür.</div>`; return; }
  if(state.reviewIdx>=Q.length) state.reviewIdx=0;
  const r=Q[state.reviewIdx];
  let item; if(r.mine){const m=state.mine.find(x=>x.id===r.mine); item=m?fromMine(m):null;} else item=fromIdx(r.i);
  if(!item){ state.reviewQ=null; return renderReview(); }
  h+=cardHTML(item, `Tekrar ${state.reviewIdx+1}/${Q.length}`);
  h+=`<div class="navrow"><button class="btn ghost" id="prev">‹ Önceki</button><span class="count">${Q.length} kart</span><button class="btn primary" id="next">Sonraki ›</button></div>`;
  $('#main').innerHTML=h;
}
const norm = s => String(s||'').toLocaleLowerCase('tr');
function renderList(keepFocus){
  const q=norm(state.q), f=state.filter;
  let items;
  if(f==='mine') items=state.mine.map(fromMine);
  else { items=[]; for(let i=0;i<W.length;i++){ const s=st(i); if(f!=='all'&&String(s)!==f) continue;
      if(q && !(norm(W[i][0]).includes(q)||norm(W[i][3]).includes(q))) continue; items.push(fromIdx(i)); } }
  if(f==='mine'&&q) items=items.filter(x=>norm(x.en).includes(q)||norm(x.tr).includes(q));
  const labels={all:'Hepsi','0':'Yeni','1':'Öğreniyorum','2':'Öğrendim',mine:'Kendi kelimelerim'};
  let h=`<input class="search" id="q" type="search" placeholder="İngilizce veya Türkçe ara" value="${esc(state.q)}" autocomplete="off">
  <div class="chips">${['all','0','1','2','mine'].map(k=>`<button class="chip" data-f="${k}" aria-pressed="${f===k}">${labels[k]}</button>`).join('')}</div>
  <div class="note">${items.length} kelime · durumu değiştirmek için sağdaki etikete dokun</div><div class="rows">`;
  const names=['Yeni','Öğreniyorum','Öğrendim'];
  h+=items.slice(0,state.limit).map(x=>`<div class="row"><div class="e">${esc(x.emoji)}</div><div class="t"><b>${esc(x.en)} <small style="color:var(--muted);font-weight:400">${esc(x.pos)}</small></b><span>${esc(x.tr)}</span></div>
    <button class="pill s${x.status}" ${x.mine?`data-cyclem="${esc(x.id)}"`:`data-cycle="${x.i}"`}>${names[x.status]}</button></div>`).join('');
  h+=`</div>${items.length>state.limit?`<button class="btn ghost more" id="more">Daha fazla göster</button>`:''}`;
  $('#main').innerHTML=h;
  if(keepFocus){const el=$('#q');el.focus();el.setSelectionRange(el.value.length,el.value.length);}
}
function renderMe(){
  let c=[0,0,0]; for(let i=0;i<W.length;i++) c[st(i)]++;
  const td=Math.max(1,Math.round((todayMs()-startMs())/DAY)+1), expected=Math.min(W.length,td*state.goal);
  const pct=n=>(n/W.length*100).toFixed(1);
  let h=`<div class="dayhead"><div><h1>İlerleme</h1><div class="sub">Plan: günde ${state.goal} kelime, ${totalDays()} günde bitiyor</div></div></div>
  <div class="stats"><div class="stat"><b>${c[2]}</b><span>Öğrendim</span></div><div class="stat"><b>${c[1]}</b><span>Öğreniyorum</span></div><div class="stat"><b>${c[0]}</b><span>Yeni</span></div></div>
  <div class="bar" role="img" aria-label="Öğrenilen yüzde ${pct(c[2])}"><i style="width:${pct(c[2])}%;background:var(--learned)"></i><i style="width:${pct(c[1])}%;background:var(--learning)"></i></div>
  <p class="note">%${pct(c[2])} tamamlandı · bugüne kadar plana göre ${expected} kelime görmüş olman gerekiyor.</p>
  <div class="section"><h2>Kendi kelimeni ekle</h2>
  <form class="form" id="addForm"><div class="two"><label>İngilizce<input id="nEn" required autocomplete="off"></label><label>Türkçe<input id="nTr" required autocomplete="off"></label></div>
  <div class="two"><label>Emoji (isteğe bağlı)<input id="nEm" maxlength="8" autocomplete="off"></label><label>Tür (isteğe bağlı)<input id="nPos" placeholder="n, v, adj…" autocomplete="off"></label></div>
  <label>Örnek cümle (isteğe bağlı)<input id="nEx" autocomplete="off"></label><button class="btn primary" type="submit">Ekle</button></form>
  <p class="note">${state.mine.length} kendi kelimen var. Tekrar sekmesinde karışık olarak çıkarlar. </p></div>
  <div class="section"><h2>Plan ayarları</h2><form class="form" id="setForm"><div class="two">
  <label>Günlük hedef<input id="sGoal" type="number" min="3" max="50" value="${state.goal}"></label>
  <label>Başlangıç tarihi<input id="sStart" type="date" value="${state.start}"></label></div><button class="btn ghost" type="submit">Kaydet</button></form>
  <p class="note">Kelime sırası sabit ve karışık; günlük hedefi değiştirince günler buna göre yeniden bölünür.</p></div>
  <div class="section"><h2>Yedekle / başka cihaza taşı</h2>
  <p class="note">İlerlemen bu cihazın tarayıcısında saklanıyor. Telefondan tablete geçerken veya yedek almak için kodu kopyala, diğer cihazda yapıştır.</p>
  <div class="form"><button class="btn ghost" id="copyCode" type="button">İlerleme kodunu kopyala</button>
  <label>Kodu buraya yapıştır<input id="codeIn" autocomplete="off" placeholder="Kopyaladığın kod"></label>
  <button class="btn primary" id="loadCode" type="button">Bu kodu yükle</button></div></div>
  <p class="note">Türkçe anlamlar ve örnek cümleler yapay zekâ ile hazırlandı; küçük hatalar olabilir.</p>`;
  $('#main').innerHTML=h;
}
function render(fromSync){
  if(fromSync && state.tab==='list' && document.activeElement && document.activeElement.id==='q') return renderList(true);
  if(fromSync && state.tab==='me' && document.activeElement && document.activeElement.closest && document.activeElement.closest('form')) return;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===state.tab));
  ({today:renderToday,review:renderReview,list:renderList,me:renderMe})[state.tab]();
}
function currentItem(){
  if(state.tab==='today'){ const ids=dayWords(dayNo()); return ids.length?fromIdx(ids[state.idx]):null; }
  if(state.tab==='review'&&state.reviewQ&&state.reviewQ.length){ const r=state.reviewQ[state.reviewIdx]; if(r.mine){const m=state.mine.find(x=>x.id===r.mine);return m?fromMine(m):null;} return fromIdx(r.i); }
  return null;
}
function setMine(id,v){ const m=state.mine.find(x=>x.id===id); if(!m) return; m.status=v; saveLocal(); }
function step(n){
  state.shown=false;
  if(state.tab==='today'){ const L=dayWords(dayNo()).length; state.idx=(state.idx+n+L)%L; }
  else { const L=state.reviewQ.length; state.reviewIdx=(state.reviewIdx+n+L)%L; }
  render(); const c=$('#card'); if(c){c.classList.add('flip');setTimeout(()=>c.classList.remove('flip'),150);}
}
document.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.shown=false; if(t.dataset.tab==='review') state.reviewQ=null; state.limit=60; render(); $('#main').scrollTop=0; return; }
  if(t.id==='reveal'){ state.shown=true; render(); return; }
  if(t.dataset.dir){ state.dir=t.dataset.dir; state.shown=false; render(); return; }
  if(t.dataset.set){ const v=Number(t.dataset.set), it=currentItem(); if(!it) return; const nv=it.status===v?0:v;
    if(it.mine) setMine(it.id,nv); else setStatus(it.i,nv);
    if(nv===2){ toast('Öğrendim ✓'); setTimeout(()=>step(1),350); } else render(); return; }
  if(t.id==='next') return step(1);
  if(t.id==='prev') return step(-1);
  if(t.dataset.go){ state.idx=Number(t.dataset.go); state.shown=false; render(); return; }
  if(t.id==='prevDay'){ state.dayOffset--; state.idx=0; state.shown=false; render(); return; }
  if(t.id==='nextDay'){ state.dayOffset++; state.idx=0; state.shown=false; render(); return; }
  if(t.id==='backToday'){ state.dayOffset=0; state.idx=0; state.shown=false; render(); return; }
  if(t.id==='shuffle'){ state.reviewQ=null; state.shown=false; render(); return; }
  if(t.dataset.f){ state.filter=t.dataset.f; state.limit=60; render(); return; }
  if(t.id==='copyCode'){ const c=exportCode(); (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Kod kopyalandı')).catch(()=>{const el=$('#codeIn');el.value=c;el.select();toast('Kodu seçip kopyala');}); return; }
  if(t.id==='loadCode'){ try{ importCode($('#codeIn').value); toast('İlerleme yüklendi'); render(); }catch(err){ toast('Kod okunamadı, tamamını yapıştır'); } return; }
  if(t.id==='more'){ state.limit+=100; render(); return; }
  if(t.dataset.cycle!==undefined){ const i=Number(t.dataset.cycle); setStatus(i,(st(i)+1)%3); render(); return; }
  if(t.dataset.cyclem){ const m=state.mine.find(x=>x.id===t.dataset.cyclem); if(m){ setMine(m.id,((m.status||0)+1)%3); render(); } return; }
});
let qt; document.addEventListener('input', e=>{ if(e.target.id==='q'){ state.q=e.target.value; state.limit=60; clearTimeout(qt); qt=setTimeout(()=>renderList(true),150);} });
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='addForm'){
    const w={en:$('#nEn').value.trim(), tr:$('#nTr').value.trim(), emoji:$('#nEm').value.trim(), pos:$('#nPos').value.trim(), ex:$('#nEx').value.trim(), status:1, created:Date.now()};
    if(!w.en||!w.tr) return;
    w.id='l'+w.created; state.mine.unshift(w); saveLocal();
    toast('Eklendi: '+w.en); e.target.reset(); render();
  }
  if(e.target.id==='setForm'){
    const g=Math.min(50,Math.max(3,parseInt($('#sGoal').value,10)||10)), s=$('#sStart').value||state.start;
    state.goal=g; state.start=s; state.dayOffset=0; state.idx=0; saveProgress(); toast('Plan kaydedildi'); render();
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input')) return;
  if(state.tab!=='today'&&state.tab!=='review') return;
  if(e.key===' '){ e.preventDefault(); state.shown=!state.shown; render(); }
  else if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1);
});
initDb();
})();
</script>

</body></html>
